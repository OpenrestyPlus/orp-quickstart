name: openresty-plus

services:
  mysql:
    image: mysql:8.4
    network_mode: host
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openresty-plus}
      MYSQL_USER: ${MYSQL_USER:-openresty-plus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 scripts/init-compose-env.sh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 scripts/init-compose-env.sh}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    network_mode: host
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?请在 .env 中填写 BACKEND_IMAGE}:${IMAGE_TAG:-latest}
    network_mode: host
    environment:
      OPENRESTY_HTTP_ADDR: :8081
      OPENRESTY_DB_URL: jdbc:mysql://127.0.0.1:3306/${MYSQL_DATABASE:-openresty-plus}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      OPENRESTY_DB_USERNAME: ${MYSQL_USER:-openresty-plus}
      OPENRESTY_DB_PASSWORD: ${MYSQL_PASSWORD:?请先运行 scripts/init-compose-env.sh}
      OPENRESTY_ADMIN_USERNAME: ${ADMIN_USERNAME:-vben}
      OPENRESTY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先运行 scripts/init-compose-env.sh}
      OPENRESTY_DATA_KEY: ${DATA_KEY:?请先运行 scripts/init-compose-env.sh}
      OPENRESTY_REDIS_ADDR: 127.0.0.1:6379
      OPENRESTY_REDIS_DB: 0
      OPENRESTY_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      OPENRESTY_KAFKA_TOPIC: dtl-602-openresty-plus
      OPENRESTY_KAFKA_CONSUMER_GROUP: openresty-plus-control-plane-v1
    volumes:
      - ./runtime:/workspace/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  openresty-east-1:
    image: ${RUNTIME_IMAGE:?请在 .env 中填写 RUNTIME_IMAGE}:${IMAGE_TAG:-latest}
    network_mode: host
    hostname: openresty-east-1
    environment:
      RUNTIME_HTTP_PORT: 18080
      CONTROL_API_BRIDGE_PORT: 18081
      NODE_REGISTRATION_ENABLED: "false"
      NODE_NAME: openresty-east-1
      NODE_HOST: 127.0.0.1
      NODE_SERVICE_PORT: 18080
      NODE_CONTROL_API_URL: http://127.0.0.1:18081
    volumes:
      - ./runtime/native-config:/etc/openresty/generated
      - ./runtime/openresty-east-1/log:/var/log/nginx
    restart: unless-stopped

  openresty-east-2:
    image: ${RUNTIME_IMAGE:?请在 .env 中填写 RUNTIME_IMAGE}:${IMAGE_TAG:-latest}
    network_mode: host
    hostname: openresty-east-2
    environment:
      RUNTIME_HTTP_PORT: 18180
      CONTROL_API_BRIDGE_PORT: 18181
      NODE_REGISTRATION_ENABLED: "false"
      NODE_NAME: openresty-east-2
      NODE_HOST: 127.0.0.1
      NODE_SERVICE_PORT: 18180
      NODE_CONTROL_API_URL: http://127.0.0.1:18181
    volumes:
      - ./runtime/native-config-east-2:/etc/openresty/generated
      - ./runtime/openresty-east-2/log:/var/log/nginx
    restart: unless-stopped

  openresty-east-3:
    image: ${RUNTIME_IMAGE:?请在 .env 中填写 RUNTIME_IMAGE}:${IMAGE_TAG:-latest}
    network_mode: host
    hostname: openresty-east-3
    environment:
      RUNTIME_HTTP_PORT: 18280
      CONTROL_API_BRIDGE_PORT: 18281
      NODE_REGISTRATION_ENABLED: "false"
      NODE_NAME: openresty-east-3
      NODE_HOST: 127.0.0.1
      NODE_SERVICE_PORT: 18280
      NODE_CONTROL_API_URL: http://127.0.0.1:18281
    volumes:
      - ./runtime/native-config-east-3:/etc/openresty/generated
      - ./runtime/openresty-east-3/log:/var/log/nginx
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?请在 .env 中填写 FRONTEND_IMAGE}:${IMAGE_TAG:-latest}
    networks: [quickstart]
    expose: ["8080"]
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    networks: [quickstart]
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

  importer:
    image: ${IMPORTER_IMAGE:?请在 .env 中填写 IMPORTER_IMAGE}:${IMAGE_TAG:-latest}
    profiles: [importer]
    network_mode: host
    environment:
      NGINX_IMPORTER_ADDR: :8090
      NGINX_IMPORTER_STORAGE: /data
      ORP_BACKEND_URL: http://127.0.0.1:8081
    volumes:
      - ./runtime/importer:/data
    restart: unless-stopped

networks:
  quickstart:

volumes:
  mysql-data:
  redis-data:
  kafka-data:
